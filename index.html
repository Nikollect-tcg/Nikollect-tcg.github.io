<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PokéCollect - Gestion de collection Pokémon TCG</title>
  <base target="_self" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@preline/preline@2.0.0/dist/preline.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .page-content { display: none; }
    .page-content.active-page { display: block; }
    .card-img { transition: transform 0.3s; }
    .card-img:hover { transform: scale(1.05); }
    .nav-btn.active { border-bottom: 3px solid #2A75BB; color: #2A75BB; }
    .dark .nav-btn.active { border-bottom-color: #FFCB05; color: #FFCB05; }
    #zoom-display { width: 300px; height: 420px; background-repeat: no-repeat; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-full">
  <!-- Header (injected by main.js) -->
  <header id="site-header" class="bg-white dark:bg-gray-800 shadow-sm"></header>

  <!-- Navigation (injected by main.js) -->
  <nav id="site-nav" class="bg-white dark:bg-gray-800 shadow-sm"></nav>

  <!-- Main content container where partial pages will be loaded -->
  <main id="app" class="container mx-auto px-4 py-6">
    <!-- Pages will be injected here -->
  </main>

  <!-- Modals and shared elements (loaded as partial) -->
  <div id="modals-container"></div>

  <!-- Zoom display element (shared) -->
  <div id="zoom-display" class="hidden absolute bg-white border-2 border-pokemon-blue shadow-lg rounded-md overflow-hidden z-[100]"></div>

  <!-- App logic and main scripts -->
  <script src="assets/js/appLogic.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
